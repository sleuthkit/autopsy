OpenIDE-Module-Long-Description=M\u00F3dulo de procesamiento de datos de b\u00FAsqueda por palabra clave.\n\nEl m\u00F3dulo indexa los archivos encontrados en la imagen de disco durante el procesamiento de datos.\nLuego ejecuta peri\u00F3dicamente la b\u00FAsqueda en los archivos indexados mediante una o m\u00E1s listas de palabras clave (que contienen palabras simples o expresiones regulares) y publica los resultados.\n\nEl m\u00F3dulo tambi\u00E9n contiene herramientas adicionales integradas en la interfaz gr\u00E1fica principal, como la configuraci\u00F3n de listas de palabras clave, la barra de b\u00FAsqueda por palabra clave en la esquina superior derecha, el visor de texto extra\u00EDdo y el visor de resultados de b\u00FAsqueda que resalta las palabras clave encontradas.
