Server_configureSolrConnection_unsupportedSolrDesc=<html><body><p style="width: 400px">Este caso se cre\u00F3 con una versi\u00F3n anterior de la b\u00FAsqueda por palabra clave que ya no es compatible.  Puede continuar sin actualizar, pero algunas funciones de b\u00FAsqueda por palabra clave no podr\u00E1n usarse mientras el caso est\u00E9 abierto y se producir\u00E1n errores.  Tambi\u00E9n puede optar por actualizar la versi\u00F3n de b\u00FAsqueda por palabra clave del caso.  Si lo hace, deber\u00E1 ejecutar la b\u00FAsqueda por palabra clave con la indexaci\u00F3n de Solr seleccionada para usar funciones como la b\u00FAsqueda ad hoc con las im\u00E1genes del caso.</p></body></html>
