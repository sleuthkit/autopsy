ImageGalleryOptionsPanel.enabledByDefaultBox.text=Habilitar la galer\u00eda de im\u00e1genes por defecto para nuevos casos.
ImageGalleryOptionsPanel.enabledForCaseBox.toolTipText=Si la galer\u00eda de im\u00e1genes est\u00e1 deshabilitada, solo se registrar\u00e1 que se necesita una actualizaci\u00f3n. Si se habilita despu\u00e9s de la ingesta, realizar\u00e1 una actualizaci\u00f3n masiva basada en los resultados de la ingesta. Si est\u00e1 deshabilitada, se te pedir\u00e1 habilitarla al intentar abrir su ventana.
ImageGalleryOptionsPanel.descriptionLabel.text=<html>Para minimizar los tiempos de inicio, la galer\u00eda de im\u00e1genes actualizar\u00e1 constantemente su base de datos interna.<br />Esto puede hacer que la ingesta sea m\u00e1s lenta si no necesitas las funciones de la galer\u00eda de im\u00e1genes.<br />Usa esta configuraci\u00f3n para deshabilitar la galer\u00eda si no la necesitas.</html>
ImageGalleryOptionsPanel.furtherDescriptionArea.text=Si la galer\u00eda de im\u00e1genes est\u00e1 deshabilitada, solo se registrar\u00e1 que se necesita una actualizaci\u00f3n. Si se habilita despu\u00e9s de la ingesta, realizar\u00e1 una actualizaci\u00f3n masiva basada en los resultados de la ingesta. Si est\u00e1 deshabilitada, se te pedir\u00e1 habilitarla al intentar abrir su ventana.
