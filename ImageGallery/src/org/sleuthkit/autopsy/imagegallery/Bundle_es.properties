OpenIDE-Module-Long-Description=\
    Nueva galer\u00eda de im\u00e1genes y videos dise\u00f1ada para hacer que las investigaciones intensivas en im\u00e1genes sean m\u00e1s eficientes. Este trabajo ha sido financiado por DHS S&T y esta es una versi\u00f3n beta. No est\u00e1 disponible en el sitio sleuthkit.org y ha sido distribuida a usuarios limitados.
