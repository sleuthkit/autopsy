ImageGalleryOptionsPanel.enabledForCaseBox.toolTipText=Si la galer\u00EDa de im\u00E1genes est\u00E1 deshabilitada, solo se registra que es necesaria una actualizaci\u00F3n.  Si la galer\u00EDa de im\u00E1genes se habilita despu\u00E9s del procesamiento de datos, realizar\u00E1 una actualizaci\u00F3n masiva basada en los resultados del procesamiento.  Si la galer\u00EDa de im\u00E1genes est\u00E1 deshabilitada, se le pedir\u00E1 que la habilite al intentar abrir su ventana.
ImageGalleryOptionsPanel.descriptionLabel.text=<html>Para minimizar sus tiempos de inicio, la galer\u00EDa de im\u00E1genes actualiza constantemente su base de datos interna. <br />Esto puede ralentizar el procesamiento de datos si no necesita las funciones de la galer\u00EDa de im\u00E1genes. <br />Use esta configuraci\u00F3n para deshabilitar la galer\u00EDa de im\u00E1genes si no la necesita.</html>
ImageGalleryOptionsPanel.furtherDescriptionArea.text=Si la galer\u00EDa de im\u00E1genes est\u00E1 deshabilitada, solo se registra que es necesaria una actualizaci\u00F3n.  Si la galer\u00EDa de im\u00E1genes se habilita despu\u00E9s del procesamiento de datos, realizar\u00E1 una actualizaci\u00F3n masiva basada en los resultados del procesamiento.  Si la galer\u00EDa de im\u00E1genes est\u00E1 deshabilitada, se le pedir\u00E1 que la habilite al intentar abrir su ventana.
