OpenIDE-Module-Long-Description=Nueva galer\u00EDa de im\u00E1genes y v\u00EDdeos dise\u00F1ada para que las investigaciones con gran cantidad de im\u00E1genes sean m\u00E1s eficientes.  Este trabajo ha sido financiado por DHS S&T y es una versi\u00F3n beta. No est\u00E1 disponible en el sitio sleuthkit.org y se ha distribuido a un n\u00FAmero limitado de usuarios.
