OpenAction.multiUserDialog.ContentText=La galer\u00EDa de im\u00E1genes se actualiza de forma distinta en los casos multiusuario que en los casos de un solo usuario. En particular:\n\nSi su equipo est\u00E1 analizando una fuente de datos, recibir\u00E1 actualizaciones de la galer\u00EDa de im\u00E1genes en tiempo real a medida que se analizan los archivos (hash, EXIF, etc.). Es el mismo comportamiento que en un caso de un solo usuario.\n\nSi otro equipo de su cl\u00FAster multiusuario est\u00E1 analizando una fuente de datos, solo recibir\u00E1 actualizaciones sobre los archivos de esa fuente de datos cuando abra la galer\u00EDa de im\u00E1genes, lo que har\u00E1 que la base de datos local se reconstruya a partir de los resultados de otros nodos.
OpenAction.multiUserDialog.Header=Galer\u00EDa de im\u00E1genes multiusuario
