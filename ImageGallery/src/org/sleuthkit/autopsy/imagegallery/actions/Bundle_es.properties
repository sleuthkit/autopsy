OpenAction.openTopComponent.error.message=Se produjo un error al intentar abrir la galer\u00EDa de im\u00E1genes.
OpenAction.openTopComponent.error.title=No se pudo abrir la galer\u00EDa de im\u00E1genes
OpenAction.stale.confDlg.msg=Es posible que la base de datos de im\u00E1genes/v\u00EDdeos est\u00E9 desactualizada. \u00BFDesea actualizarla y escuchar m\u00E1s resultados del procesamiento de datos?\nSi elige 'S\u00ED', se actualizar\u00E1 la base de datos y se habilitar\u00E1 la escucha de procesamientos futuros.\n\nEl estado de la actualizaci\u00F3n de la base de datos aparecer\u00E1 en la esquina inferior derecha de la ventana de la aplicaci\u00F3n.
