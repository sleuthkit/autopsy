OpenIDE-Module-Long-Description=\
    M\u00f3dulo de ingest\u00f3n de conjuntos de hash.  \n\n\
    El m\u00f3dulo de ingest\u00f3n analiza archivos en la imagen de disco y los marca como "conocidos" (basado en la b\u00fasqueda de hash del NSRL para archivos "conocidos") y "malos/interesantes" (basado en uno o m\u00e1s conjuntos de hash provistos por el usuario).\n\n\
    El m\u00f3dulo tambi\u00e9n contiene herramientas adicionales no relacionadas con ingest\u00f3n que est\u00e1n integradas en la GUI, como la b\u00fasqueda de archivos por hash y la configuraci\u00f3n de conjuntos de hash.
