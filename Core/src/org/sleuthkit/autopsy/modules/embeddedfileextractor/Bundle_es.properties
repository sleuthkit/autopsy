OpenIDE-Module-Long-Description=\
    M\u00f3dulo de Ingesta de Extracci\u00f3n de Archivos Embebidos\n\nEl M\u00f3dulo de Ingesta de Extracci\u00f3n de Archivos Embebidos procesa archivos de documentos (como doc, docx, ppt, pptx, xls, xlsx) y archivos comprimidos (como zip y otros tipos soportados por el extractor 7zip).\n\
    El contenido de estos archivos se extrae y los archivos derivados se agregan a la ingesta actual para ser procesados por los m\u00f3dulos de ingesta configurados.\n\
    Si el archivo derivado es un archivo comprimido, ser\u00e1 reprocesado por el extractor 7zip - el extractor procesar\u00e1 archivos comprimidos con m\u00faltiples niveles de profundidad.\n\n\
    Los archivos extra\u00eddos son navegables en el \u00e1rbol de directorios.\n\n\
    El m\u00f3dulo es compatible con sistemas operativos Windows, Linux y Mac.
