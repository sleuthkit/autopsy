OpenIDE-Module-Long-Description=M\u00F3dulo de procesamiento de datos de extracci\u00F3n de archivos incrustados\n\nEl m\u00F3dulo de procesamiento de datos de extracci\u00F3n de archivos incrustados procesa archivos de documentos (como doc, docx, ppt, pptx, xls, xlsx) y archivos comprimidos (como zip y otros tipos compatibles con el extractor 7zip).\nEl contenido de estos archivos se extrae y los archivos derivados se vuelven a agregar al procesamiento de datos actual para que los procesen los m\u00F3dulos configurados.\nSi el archivo derivado es un archivo comprimido, el extractor 7zip lo volver\u00E1 a procesar; el extractor procesa archivos comprimidos con N niveles de profundidad.\n\nLos archivos extra\u00EDdos pueden explorarse en el \u00E1rbol de directorios.\n\nEl m\u00F3dulo es compatible con los sistemas operativos Windows, Linux y Mac.
