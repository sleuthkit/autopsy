FilesSetDefsPanel.interesting.jTextArea1.text=Este m\u00F3dulo permite encontrar archivos que cumplen criterios especificados. Cada conjunto contiene reglas basadas en las caracter\u00EDsticas de los archivos. Si hay reglas de inclusi\u00F3n, basta con cumplir una, siempre que no se cumpla ninguna regla de exclusi\u00F3n. Si solo hay reglas de exclusi\u00F3n, se encuentran los archivos que no coinciden con ellas.
FilesSetDefsPanel.ingest.jTextArea1.text=Agregue reglas para analizar solo un subconjunto de los archivos de una fuente de datos. Las reglas se organizan en conjuntos y solo puede usarse un conjunto a la vez. Si hay reglas de inclusi\u00F3n, basta con cumplir una, siempre que no se cumpla ninguna regla de exclusi\u00F3n. Si solo hay reglas de exclusi\u00F3n, se analizan los archivos que no coinciden con ellas.
