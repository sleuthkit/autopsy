CountsViewPane.scaleHelp.label.text=Escalas:   
CountsViewPane.scaleHelpLinear=La escala lineal es adecuada para muchos casos de uso.  Cuando se selecciona esta escala, la altura de las barras representa los recuentos de forma lineal, uno a uno, y el eje Y se etiqueta con valores. Cuando el intervalo de valores es muy grande, los per\u00EDodos con recuentos bajos pueden tener una barra demasiado peque\u00F1a para verse.  Para ayudar al usuario a detectarlo, las etiquetas de los intervalos de fechas con eventos aparecen en negrita.  Para ver las barras demasiado peque\u00F1as, hay tres opciones: ajustar el tama\u00F1o de la ventana para que la l\u00EDnea de tiempo tenga m\u00E1s espacio vertical, ajustar el intervalo de tiempo mostrado para excluir los per\u00EDodos con barras m\u00E1s grandes o cambiar la escala a logar\u00EDtmica.
CountsViewPane.scaleHelpLog=La escala logar\u00EDtmica representa el n\u00FAmero de eventos de forma no lineal, lo que comprime la diferencia entre n\u00FAmeros grandes y peque\u00F1os. Tenga en cuenta que, incluso con la escala logar\u00EDtmica, una diferencia extremadamente grande en los recuentos puede seguir produciendo barras demasiado peque\u00F1as para verse.  En ese caso, la \u00FAnica opci\u00F3n puede ser filtrar los eventos para reducir la diferencia en los recuentos.  NOTA: como la escala logar\u00EDtmica se aplica a cada tipo de evento por separado, el significado de la altura de la barra combinada no es intuitivo y, para destacarlo, no se muestran etiquetas en el eje Y con la escala logar\u00EDtmica. La escala logar\u00EDtmica debe usarse para comparar r\u00E1pidamente los recuentos 
CountsViewPane.scaleHelpLog2=a lo largo del tiempo dentro de un tipo, o entre tipos en un mismo per\u00EDodo, pero no ambas cosas.
CountsViewPane.scaleHelpLog3=\ Para comparaciones absolutas deben usarse los recuentos reales (disponibles en la informaci\u00F3n sobre herramientas o en el visor de resultados).  Use la escala logar\u00EDtmica con precauci\u00F3n.
