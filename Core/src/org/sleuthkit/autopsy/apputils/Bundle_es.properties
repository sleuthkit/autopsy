CTL_ResetWindowsAction=Restablecer ventanas
ResetWindowAction.caseCloseFailure.text=No se puede cerrar el caso actual; el software se reiniciar\u00E1 y las ubicaciones de las ventanas se restablecer\u00E1n la pr\u00F3xima vez que se cierre el software.
ResetWindowAction.caseSaveMetadata.text=No se puede guardar la ruta del caso actual; el software se reiniciar\u00E1 y las ubicaciones de las ventanas se restablecer\u00E1n, pero el caso actual no se abrir\u00E1 tras el reinicio.
ResetWindowAction.confirm.text=Para restablecer las ubicaciones de las ventanas, el software se cerrar\u00E1 y se reiniciar\u00E1. Si hay un caso abierto, se cerrar\u00E1. Si hay un procesamiento de datos o una b\u00FAsqueda en curso, se interrumpir\u00E1. \u00BFEst\u00E1 seguro de que desea reiniciar el software para restablecer todas las ubicaciones de las ventanas?
