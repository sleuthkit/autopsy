OpenIDE-Module-Long-Description=Este es el m\u00F3dulo principal de Autopsy.\n\nEl m\u00F3dulo contiene los componentes b\u00E1sicos necesarios para que la aplicaci\u00F3n se ejecute: la plataforma RCP, la interfaz gr\u00E1fica de ventanas, los enlaces de Sleuth Kit, el modelo de datos/almacenamiento, el explorador, los visores de resultados, los visores de contenido, el marco de procesamiento de datos, los informes y las herramientas principales, como la b\u00FAsqueda de archivos.\n\nEl marco incluido en el m\u00F3dulo contiene API para desarrollar m\u00F3dulos de procesamiento de datos, visores e informes.  Los m\u00F3dulos pueden implementarse como complementos mediante el instalador de complementos de Autopsy.\nEste m\u00F3dulo no debe desinstalarse; sin \u00E9l, Autopsy no se ejecutar\u00E1.\n\nPara obtener m\u00E1s informaci\u00F3n, consulte http://www.sleuthkit.org/autopsy/
OpenIDE-Module-Name=Autopsy-Core
