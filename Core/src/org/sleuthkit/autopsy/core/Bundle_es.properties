OpenIDE-Module-Display-Category=Infraestructura
OpenIDE-Module-Long-Description=\
    Este es el m\u00f3dulo central de Autopsy.\n\n\
    El m\u00f3dulo contiene los componentes esenciales necesarios para que la aplicaci\u00f3n funcione: la plataforma RCP, la interfaz de usuario con ventanas, enlaces a sleuthkit, modelo de datos / almacenamiento, explorador, visores de resultados, visores de contenido, marco de procesamiento, informes y herramientas centrales como la b\u00fasqueda de archivos.\n\n\
    El marco incluido en el m\u00f3dulo contiene APIs para desarrollar m\u00f3dulos de procesamiento, visores e informes.\
    Los m\u00f3dulos pueden instalarse como Plugins usando el instalador de plugins de Autopsy.\n\
    Este m\u00f3dulo no debe desinstalarse: sin \u00e9l, Autopsy no funcionar\u00e1.\n\n\
    Para m\u00e1s informaci\u00f3n, visite http://www.sleuthkit.org/autopsy/
