OpenIDE-Module-Display-Category=M\u00F3dulo de Ingesta

OpenIDE-Module-Long-Description=M\u00F3dulo de ingesta de b\u00FAsqueda por palabras clave.\n\nEl m\u00F3dulo indexa los archivos encontrados en la imagen de disco en el momento de la ingesta.\nLuego ejecuta peri\u00F3dicamente la b\u00FAsqueda en los archivos indexados usando una o m\u00E1s listas de palabras clave (que contienen palabras puras y/o expresiones regulares) y publica los resultados.\n\n\El m\u00F3dulo tambi\u00E9n contiene herramientas adicionales integradas en la interfaz principal, como la configuraci\u00F3n de listas de palabras clave, barra de b\u00FAsqueda de palabras clave en la esquina superior derecha, visor de texto extra\u00EDdo y visor de resultados de b\u00FAsqueda mostrando las palabras clave encontradas destacadas.
