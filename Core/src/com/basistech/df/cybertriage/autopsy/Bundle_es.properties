CTIntegrationMissingDialog.title=Se requiere el m\u00F3dulo importador de Cyber Triage
CTIntegrationMissingDialog.descriptionLabel.text=<html><body><p>Se requiere el m\u00F3dulo importador de Cyber Triage para abrir este caso. </p><p>Para abrir este caso:</p><ul><li>Extraiga el m\u00F3dulo desde la pesta\u00F1a Integraciones del panel de opciones de Cyber Triage.</li><li>Seleccione la opci\u00F3n 'Complementos' del men\u00FA 'Herramientas' y vaya a la pesta\u00F1a 'Descargados'.</li><li>Haga clic en 'Agregar complementos...' y seleccione la ruta del complemento.</li><li>Pulse 'Instalar' para finalizar la instalaci\u00F3n.</li></ul></body></html>
CTIntegrationMissingDialog.docsLabel.text=<html>Para obtener m\u00E1s informaci\u00F3n, consulte la Gu\u00EDa del usuario de Cyber Triage</html>
