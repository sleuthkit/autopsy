OpenIDE-Module-Long-Description=M\u00f3dulo de ingesta de actividad reciente.\n\nEl m\u00f3dulo extrae informaci\u00f3n \u00faltil sobre la actividad reciente del usuario en la imagen de disco que se est\u00e1 ingiriendo, como:\n\n- Documentos abiertos recientemente,\n- Actividad web (sitios visitados, cookies almacenadas, sitios marcados, consultas de motores de b\u00fasqueda, descargas de archivos),\n- Dispositivos conectados recientemente,\n- Programas instalados.\n\nActualmente, el m\u00f3dulo s\u00f3lo admite im\u00e1genes de disco de Windows.\nEl complemento tambi\u00e9n es completamente funcional cuando se despliega en la versi\u00f3n de Windows de Autopsy.
